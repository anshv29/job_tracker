name: Job Scraper

on:
  schedule:
    # :17 instead of :00 - GitHub documents that the top of the hour is the
    # busiest time for scheduled workflows across all of GitHub and can see
    # extra delay; an off-peak minute avoids adding to that congestion.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Hard backstop: without this, a hung network call falls back to GitHub's
    # own 360-minute default, and our concurrency group (below) queues every
    # later scheduled trigger behind it instead of canceling it - that combo
    # is what produced the multi-hour gaps between runs.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scraper
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run_all.py

      - name: Persist dedup database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # run_all.py wrote straight into the working-tree jobs.db, so save that
          # file before any git operation touches the tree, then restore it after
          # syncing with origin. Without this, "git reset --hard origin/main"
          # would discard the jobs this run just marked seen.
          cp jobs.db /tmp/jobs.db.new

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/jobs.db.new jobs.db
            git add -f jobs.db
            if git diff --cached --quiet; then
              echo "No change to jobs.db, nothing to commit"
              break
            fi
            git commit -m "Update jobs.db [skip ci]"
            if git push; then
              break
            fi
            # Someone else pushed between fetch and push (a manual push from a
            # laptop, most likely) - back off briefly and retry against the new tip.
            echo "Push rejected, retrying ($attempt/5)..."
            sleep $((attempt * 5))
          done
